<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한영 변환기 정보</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/about.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">한영 변환기</div>

      <nav>
        <a href="#">홈</a>
        <a href="#">사용법</a>
        <a href="#">정보</a>
      </nav>
    </header>
    <main>
      <h1>한영 키보드 변환기</h1>
      <br />
      <p>
        이 프로젝트는 잘못된 키보드 입력(영문 상태로 한글을 친 경우)을 자동으로
        한글로 변환해주는 도구입니다.
      </p>
      <br />
      <h2>개발 목적</h2>

      <p>
        한/영 전환을 깜빡하고 입력한 문장을 빠르게 복구할 수 있도록
        만들었습니다.
      </p>
      <h2>기능</h2>

      <ul>
        <li>영문 키보드 → 한글 자동 변환</li>
        <li>쌍자음 (ㄲ, ㄸ, ㅃ, ㅆ, ㅉ) 지원</li>
        <li>이중 모음 (ㅘ, ㅙ, ㅝ 등) 지원</li>
        <li>실시간 변환</li>
      </ul>
      <h2>기술 스택</h2>

      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
      <p>Version: 0.1</p>
    </main>
  </body>
</html>
